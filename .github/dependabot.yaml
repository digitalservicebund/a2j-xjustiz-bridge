# $schema: https://www.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "./package/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      patch-updates:
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "./.github/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
