# $schema=https://www.schemastore.org/github-workflow.json
name: verify codebase integrity
on:
  push:
  workflow_call:
    secrets:
      XJUSTIZ_TOOLS_IMAGE_PAT:
        required: true
        description: Access token to download the private OCI image of the XJustiz-Tools.
      SLACK_BOT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: verify codebase integrity - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-codebase-integrity:
    name: Verify Codebase Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: prepare development environment
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.5
          sha256-checksum: 520abeaca5fb8e8175bea2acdaac4109e87768ac25ad8da5ad2e6eace5a6060b #devbox_0.17.5_linux_amd64.tar.gz

      - name: load cache for runtime dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./package/node_modules
          key: runtime-dependencies-${{ hashFiles('./package/pnpm-lock.yaml') }}-v1
          restore-keys: runtime-dependencies-

      - name: get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: load cache for link validation checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.lycheecache
          key: cache-lychee-${{ steps.date.outputs.date }}-v1
          restore-keys: cache-lychee-

      - name: load the cache for spelling and style checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Unfortunately, because Vale mixes codebase styles and 3d party
          # styles in a single directory, we must list the 3rd party ones
          # explicitly. Else the custom styles and configuration get overwritten
          # by the cache. Missing a path ain't a big deal.
          path: |
            .vale/styles/proselint
            .vale/styles/alex
          key: style-packages-${{ hashFiles('.vale.ini') }}-v1

      - name: log into registry to access XJustiz-Tools service OCI image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.XJUSTIZ_TOOLS_IMAGE_PAT }}

      - name: load cache for XJustiz-Tools service OCI image
        id: load-cache-for-xjustiz-tools-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.task/cache/xjustiz-tools-image.tar
          key: cache-xjustiz-tools-image-${{ steps.date.outputs.date }}-v2
          restore-keys: cache-xjustiz-tools-image-

      # Note: Updates are actually fetched frequently by the 'verify codebase health' workflow.
      - name: download XJustiz-Tools service OCI image if missing
        id: download-xjustiz-tools-image
        if: steps.load-cache-for-xjustiz-tools-image.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/digitalservicebund/a2j-xjustiz-tools:latest
          mkdir --parents ./.task/cache
          docker save --output ./.task/cache/xjustiz-tools-image.tar ghcr.io/digitalservicebund/a2j-xjustiz-tools:latest

      - name: update cache for XJustiz-Tools service OCI image
        if: steps.download-xjustiz-tools-image.conclusion == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.task/cache/xjustiz-tools-image.tar
          key: cache-xjustiz-tools-image-${{ steps.date.outputs.date }}-v2

      - name: load XJustiz-Tools service OCI image
        run: docker load --input ./.task/cache/xjustiz-tools-image.tar

      - run: devbox run task --verbose verify:codebase-integrity
        env:
          DEBUG: testcontainers*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: send failure notification to Slack
        uses: digitalservicebund/notify-on-failure-gha@b8fdda76a38fa8e94cf623ebdd03e4570bc4ceb0 # v1.9.0
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
