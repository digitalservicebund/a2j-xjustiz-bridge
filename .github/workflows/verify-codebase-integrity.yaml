# $schema=https://www.schemastore.org/github-workflow.json
name: verify codebase integrity
on: push
permissions:
  contents: read
jobs:
  verify-codebase-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: prepare development environment
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.5
          sha256-checksum: eb2d8fb34266ba3befc294d7d6f56e2cd4da2cacb7a0cf52db5b8092575544f8 #devbox_0.17.5_linux_amd64.tar.gz

      - name: load cache for runtime dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./package/node_modules
          key: runtime-dependencies-${{ hashFiles('./package/pnpm-lock.yaml') }}-v1
          restore-keys: runtime-dependencies-

      - name: get current date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: load cache for link validation checks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ./.lycheecache
          key: cache-lychee-${{ steps.date.outputs.date }}-v1
          restore-keys: cache-lychee-

      - name: load the cache for spelling and style checks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Unfortunately, because Vale mixes codebase styles and 3d party
          # styles in a single directory, we must list the 3rd party ones
          # explicitly. Else the custom styles and configuration get overwritten
          # by the cache. Missing a path ain't a big deal.
          path: |
            .vale/styles/proselint
            .vale/styles/alex
          key: style-packages-${{ hashFiles('.vale.ini') }}-v1

      - run: devbox run task --verbose verify:codebase-integrity
