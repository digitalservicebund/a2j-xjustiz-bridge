# $schema=https://www.schemastore.org/github-workflow.json
name: publish library to NPM package registry
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-codebase-integrity:
    uses: ./.github/workflows/verify-codebase-integrity.yaml
    secrets:
      XJUSTIZ_TOOLS_IMAGE_PAT: ${{ secrets.XJUSTIZ_TOOLS_IMAGE_PAT }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  publish:
    name: Publish
    needs: verify-codebase-integrity
    runs-on: ubuntu-latest
    environment: npm-publish-library
    permissions:
      contents: read
      id-token: write # Required to get OIDC token for NPM provenance attestation.

    steps:
      - name: checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: prepare development environment
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.5
          sha256-checksum: 520abeaca5fb8e8175bea2acdaac4109e87768ac25ad8da5ad2e6eace5a6060b #devbox_0.17.5_linux_amd64.tar.gz

      - name: load cache for runtime dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./package/node_modules
          key: runtime-dependencies-${{ hashFiles('./package/pnpm-lock.yaml') }}-v1
          restore-keys: runtime-dependencies-

      - run: devbox run task --verbose publish

      - name: send failure notification to Slack
        uses: digitalservicebund/notify-on-failure-gha@b8fdda76a38fa8e94cf623ebdd03e4570bc4ceb0 # v1.9.0
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
