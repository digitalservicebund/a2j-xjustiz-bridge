StylesPath = .vale/styles
Packages = https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/vale-cli/alex/releases/download/v0.2.3/alex.zip
Vocab = XJustiz-Bridge

[formats]
ts = md

[!{*.{lock,json,jsonc,yaml,yml,dic,aff},*.gitignore,LICENSE,CODE_OF_CONDUCT.md,*/template.md,*.dsl,.vale.ini,.vale/styles/*}]
BasedOnStyles = XJustiz-Bridge, Vale, proselint, alex

[*.ts]
BasedOnStyles = XJustiz-Bridge, Vale, proselint, alex
# Ignore TSDoc tags like `@param`.
TokenIgnores = (@[a-zA-Z]+\s+)\S+
# Fix ignoring Markdown codeblock fences.
BlockIgnores = (?s)(```.*?```)
